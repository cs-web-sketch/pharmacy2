<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- Viewport is set, but the layout is strictly 1920x1080 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中央薬局 - お呼出ディスプレイ</title>
    <style>
        /* CSS Variables for Modern Theme */
        :root {
            --primary: #0f766e; /* Teal */
            --primary-light: #14b8a6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #e11d48; /* Rose/Red for calling */
            --done-bg: #e2e8f0;
            --done-text: #94a3b8;
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* STRICTLY 1920x1080 */
        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 25px 50px;
            height: 120px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            z-index: 10;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-icon {
            background: white;
            color: var(--primary);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 2.5rem;
        }

        .time {
            font-size: 3.5rem;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: 3px;
        }

        /* Main Content Layout */
        main {
            flex: 1;
            display: flex;
            padding: 40px 50px;
            gap: 50px;
        }

        /* Left Side: Calling Now */
        .calling-section {
            flex: 0 0 45%;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 6px solid transparent;
            transition: all 0.3s ease;
        }

        .calling-section.active-border {
            border-color: var(--primary-light);
            box-shadow: 0 0 60px rgba(20, 184, 166, 0.3);
        }

        .calling-label {
            font-size: 3.5rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 40px;
            background: #f1f5f9;
            padding: 15px 60px;
            border-radius: 50px;
        }

        .calling-number {
            font-size: 20rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -8px;
        }

        /* Ping animation for new call */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim {
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        /* Right Side: Waiting List */
        .waiting-section {
            flex: 1;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        .waiting-section h2 {
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        
        .waiting-section h2 span {
            font-size: 1.8rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            overflow-y: auto;
            align-content: start;
            padding-right: 15px; /* For scrollbar */
            flex: 1;
        }

        /* Scrollbar styling */
        .number-grid::-webkit-scrollbar { width: 12px; }
        .number-grid::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 6px; }
        .number-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }

        .num-card {
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 25px 10px;
            text-align: center;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* States for cards */
        .num-card.status-calling {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(15, 118, 110, 0.4);
        }
        
        .num-card.status-calling::after {
            content: "お呼出中";
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            font-size: 1.2rem;
            font-weight: normal;
            color: rgba(255,255,255,0.9);
        }

        .num-card.status-done {
            background: var(--done-bg);
            border-color: transparent;
            color: var(--done-text);
            box-shadow: none;
        }

        /* Ticker Footer */
        .ticker-wrapper {
            background: #1e293b;
            color: white;
            height: 90px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .ticker-label {
            background: var(--accent);
            color: white;
            padding: 0 40px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 2.2rem;
            z-index: 2;
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 6px 0 15px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .ticker-label::after {
            content: '';
            position: absolute;
            right: -25px;
            top: 0;
            border-top: 45px solid transparent;
            border-bottom: 45px solid transparent;
            border-left: 25px solid var(--accent);
        }

        .ticker-content {
            padding-left: 100%; /* Start off-screen */
            display: inline-block;
            white-space: nowrap;
            font-size: 2.4rem;
            animation: ticker 30s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            margin-right: 80px;
        }

        .ticker-item::before {
            content: "◆";
            color: var(--primary-light);
            margin-right: 20px;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1><div class="header-icon">✚</div> 中央薬局</h1>
        <div class="time" id="clock">00:00:00</div>
    </header>

    <!-- Main Board -->
    <main>
        <!-- Calling Now -->
        <section class="calling-section" id="calling-box">
            <div class="calling-label">現在のお呼出番号</div>
            <div class="calling-number" id="main-number">---</div>
        </section>

        <!-- Waiting List -->
        <section class="waiting-section">
            <h2>お薬お渡し待ち <span>順次お呼び出しいたします</span></h2>
            <div class="number-grid" id="grid-container">
                <!-- JavaScript will populate cards here -->
            </div>
        </section>
    </main>

    <!-- Info Ticker -->
    <div class="ticker-wrapper">
        <div class="ticker-label">お知らせ</div>
        <div class="ticker-content">
            <span class="ticker-item">本日はご来局ありがとうございます。</span>
            <span class="ticker-item">おくすり手帳をお持ちの方は受付にお出しください。</span>
            <span class="ticker-item">マイナンバーカードの保険証利用にご協力をお願いいたします。</span>
            <span class="ticker-item">ジェネリック医薬品への変更をご希望の方は、お気軽に薬剤師までお申し付けください。</span>
            <span class="ticker-item">お車でお越しの方は、提携駐車場の駐車券を受付までお持ちください。</span>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // 1. Clock Update
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ja-JP', { hour12: false });
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Simulation Logic
        const startNum = 145; // Start of the sequence
        const endNum = 175;   // End of the sequence
        let currentNum = 153; // Number currently being called
        
        const grid = document.getElementById('grid-container');
        const mainNumber = document.getElementById('main-number');
        const callingBox = document.getElementById('calling-box');
        
        // Dictionary to store card elements
        const cardElements = {};

        // Initialize Grid
        function initGrid() {
            grid.innerHTML = '';
            for (let i = startNum; i <= endNum; i++) {
                const card = document.createElement('div');
                card.className = 'num-card';
                card.innerText = i;
                
                // Pre-set styles based on current number
                if (i < currentNum) {
                    card.classList.add('status-done');
                } else if (i === currentNum) {
                    card.classList.add('status-calling');
                    mainNumber.innerText = i;
                }
                
                grid.appendChild(card);
                cardElements[i] = card;
            }
        }

        // Call the next number
        function callNextNumber() {
            // Mark previous as done
            if (cardElements[currentNum]) {
                cardElements[currentNum].classList.remove('status-calling');
                cardElements[currentNum].classList.add('status-done');
            }

            // Increment or reset
            currentNum++;
            if (currentNum > endNum) {
                // Loop back for demo purposes
                currentNum = startNum;
                // Reset all cards to default visually
                Object.values(cardElements).forEach(card => {
                    card.className = 'num-card';
                });
            }

            // Update Main Display with Animation
            mainNumber.innerText = currentNum;
            
            // Re-trigger CSS animation
            mainNumber.classList.remove('pop-anim');
            callingBox.classList.remove('active-border');
            
            // Trigger reflow to restart animation
            void mainNumber.offsetWidth; 
            
            mainNumber.classList.add('pop-anim');
            callingBox.classList.add('active-border');

            // Highlight new card in grid
            if (cardElements[currentNum]) {
                cardElements[currentNum].classList.add('status-calling');
                // Scroll grid to the new number smoothly
                cardElements[currentNum].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Setup
        initGrid();
        
        // Simulate a new call every 6 seconds to show off the design
        setInterval(callNextNumber, 6000);

    </script>
</body>
</html>
