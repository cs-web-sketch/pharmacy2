<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中央薬局 - お呼出ディスプレイ</title>
    <style>
        /* CSS Variables for Modern Theme */
        :root {
            --primary: #0f766e; /* Teal */
            --primary-light: #14b8a6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #e11d48; /* Rose/Red for calling */
            --done-bg: #e2e8f0;
            --done-text: #94a3b8;
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
            flex-shrink: 0;
        }

        header h1 {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            background: white;
            color: var(--primary);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .time {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        /* Main Content Layout */
        main {
            flex: 1;
            display: flex;
            padding: 1.5rem 2rem;
            gap: 2rem;
            min-height: 0; /* Important for flex child sizing */
        }

        /* Left Side: Calling Now */
        .calling-section {
            flex: 0 0 42%;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid transparent;
            transition: all 0.3s ease;
            padding: 1.5rem;
        }

        .calling-section.active-border {
            border-color: var(--primary-light);
            box-shadow: 0 0 40px rgba(20, 184, 166, 0.2);
        }

        .calling-label {
            font-size: clamp(1.3rem, 2.5vw, 2.2rem);
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1.5rem;
            background: #f1f5f9;
            padding: 8px 30px;
            border-radius: 50px;
            text-align: center;
            white-space: nowrap;
        }

        .calling-number {
            font-size: clamp(6rem, 14vw, 13rem);
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -4px;
        }

        /* Ping animation for new call */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim {
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        /* Right Side: Waiting List */
        .waiting-section {
            flex: 1;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden; /* Prevent overflow */
        }

        .waiting-section h2 {
            font-size: clamp(1.3rem, 2.2vw, 1.8rem);
            color: var(--text-main);
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-shrink: 0;
        }
        
        .waiting-section h2 span {
            font-size: clamp(0.9rem, 1.2vw, 1.1rem);
            color: var(--text-muted);
            font-weight: normal;
        }

        /* Dynamic Grid Container: NO SCROLL, strictly fits area */
        .number-grid {
            flex: 1;
            display: grid;
            gap: 1rem;
            width: 100%;
            height: 100%;
            overflow: hidden; /* No scrollbar! */
        }

        .num-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 3.5vh, 2.8rem);
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* States for cards */
        .num-card.status-calling {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 8px 16px rgba(15, 118, 110, 0.25);
        }
        
        .num-card.status-calling::after {
            content: "お呼出中";
            position: absolute;
            bottom: 4px;
            font-size: clamp(0.6rem, 1.2vh, 0.85rem);
            font-weight: normal;
            color: rgba(255,255,255,0.9);
        }

        .num-card.status-done {
            background: var(--done-bg);
            border-color: transparent;
            color: var(--done-text);
        }

        /* Ticker Footer */
        .ticker-wrapper {
            background: #1e293b;
            color: white;
            height: clamp(3rem, 6vh, 4rem);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .ticker-label {
            background: var(--accent);
            color: white;
            padding: 0 1.8rem;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: clamp(1rem, 1.8vw, 1.3rem);
            z-index: 2;
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 4px 0 10px rgba(0,0,0,0.2);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .ticker-label::after {
            content: '';
            position: absolute;
            right: -12px;
            top: 0;
            border-top: 2rem solid transparent;
            border-bottom: 2rem solid transparent;
            border-left: 12px solid var(--accent);
        }

        .ticker-content {
            padding-left: 100%;
            display: inline-block;
            white-space: nowrap;
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            animation: ticker 35s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            margin-right: 4rem;
        }

        .ticker-item::before {
            content: "◆";
            color: var(--primary-light);
            margin-right: 0.8rem;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Responsive adjustments for narrow screens (Tablets & Mobile) */
        @media (max-width: 820px) {
            main {
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
            }
            .calling-section {
                flex: 0 0 auto;
                padding: 1.5rem 1rem;
            }
            .calling-number {
                font-size: clamp(5rem, 15vw, 8rem);
            }
            .waiting-section {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1><div class="header-icon">✚</div> 中央薬局</h1>
        <div class="time" id="clock">00:00:00</div>
    </header>

    <!-- Main Board -->
    <main>
        <!-- Calling Now -->
        <section class="calling-section" id="calling-box">
            <div class="calling-label">現在のお呼出番号</div>
            <div class="calling-number" id="main-number">---</div>
        </section>

        <!-- Waiting List -->
        <section class="waiting-section">
            <h2>お薬お渡し待ち <span>順次お呼び出しいたします</span></h2>
            <div class="number-grid" id="grid-container">
                <!-- Dynamically calculated grid cards will be inserted here -->
            </div>
        </section>
    </main>

    <!-- Info Ticker -->
    <div class="ticker-wrapper">
        <div class="ticker-label">お知らせ</div>
        <div class="ticker-content">
            <span class="ticker-item">本日はご来局ありがとうございます。</span>
            <span class="ticker-item">おくすり手帳をお持ちの方は受付にお出しください。</span>
            <span class="ticker-item">マイナンバーカードの保険証利用にご協力をお願いいたします。</span>
            <span class="ticker-item">ジェネリック医薬品への変更をご希望の方は、お気軽に薬剤師までお申し付けください。</span>
            <span class="ticker-item">お車でお越しの方は、提携駐車場の駐車券を受付までお持ちください。</span>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // 1. Clock Update
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ja-JP', { hour12: false });
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. State Variables
        const startNum = 101; 
        const totalNumCount = 100; // 101 to 200
        let currentNum = 135; // Currently called number

        const gridContainer = document.getElementById('grid-container');
        const mainNumber = document.getElementById('main-number');
        const callingBox = document.getElementById('calling-box');

        let maxDisplayItems = 12; // Default, will be recalculated

        // 3. Dynamic Grid Calculation based on available screen space
        function calculateGridCapacity() {
            const width = gridContainer.clientWidth;
            const height = gridContainer.clientHeight;

            if (width === 0 || height === 0) return;

            // Target dimensions for cards
            const targetWidth = width < 480 ? 80 : 120;  // Card width target
            const targetHeight = height < 400 ? 55 : 80; // Card height target

            const gap = 16; // 1rem gap

            // Calculate columns and rows that fit inside without scroll
            let cols = Math.max(2, Math.floor((width + gap) / (targetWidth + gap)));
            let rows = Math.max(2, Math.floor((height + gap) / (targetHeight + gap)));

            // Apply calculated grid layout
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            gridContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            maxDisplayItems = cols * rows;

            // Re-render items
            renderGrid();
        }

        // 4. Render Grid Items strictly within capacity
        function renderGrid() {
            gridContainer.innerHTML = '';

            // Calculate range of numbers to show
            // Show a few completed ones and upcoming ones around currentNum
            const pastCount = Math.floor(maxDisplayItems * 0.25); // Show ~25% completed numbers
            let start = Math.max(startNum, currentNum - pastCount);
            let end = start + maxDisplayItems - 1;

            for (let i = start; i <= end; i++) {
                const card = document.createElement('div');
                card.className = 'num-card';
                card.innerText = i;

                if (i < currentNum) {
                    card.classList.add('status-done');
                } else if (i === currentNum) {
                    card.classList.add('status-calling');
                }

                gridContainer.appendChild(card);
            }
        }

        // 5. Call Next Number Procedure
        function callNextNumber() {
            currentNum++;
            if (currentNum > startNum + totalNumCount) {
                currentNum = startNum;
            }

            // Update Main Calling Display
            mainNumber.innerText = currentNum;

            // Trigger Animation
            mainNumber.classList.remove('pop-anim');
            callingBox.classList.remove('active-border');
            void mainNumber.offsetWidth; // Force reflow
            mainNumber.classList.add('pop-anim');
            callingBox.classList.add('active-border');

            // Update List Display
            renderGrid();
        }

        // 6. Event Listeners for Responsive Sizing
        window.addEventListener('resize', calculateGridCapacity);

        // Initial setup
        mainNumber.innerText = currentNum;
        // Wait for DOM layout then calculate grid
        setTimeout(calculateGridCapacity, 50);

        // Simulation interval (Every 5 seconds)
        setInterval(callNextNumber, 5000);

    </script>
</body>
</html>
