<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中央薬局 - お呼出ディスプレイ</title>
    <style>
        /* CSS Variables for Modern Theme */
        :root {
            --primary: #0f766e; /* Teal */
            --primary-light: #14b8a6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #e11d48; /* Rose/Red for calling */
            --done-bg: #e2e8f0;
            --done-text: #94a3b8;
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* 画面全体を使うが、モバイル時はスクロールを許可するように変更（後述のメディアクエリで上書き） */
            overflow: hidden; 
        }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            background: white;
            color: var(--primary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.5rem;
            flex-shrink: 0; /* アイコンが縮まないようにする */
        }

        .time {
            font-size: 2rem;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        /* Main Content Layout */
        main {
            flex: 1;
            display: flex;
            padding: 2rem 3rem;
            gap: 3rem;
            /* Flexアイテムがはみ出さないための設定 */
            min-height: 0;
        }

        /* Left Side: Calling Now */
        .calling-section {
            flex: 0 0 45%;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid transparent;
            transition: all 0.3s ease;
            padding: 2rem;
        }

        .calling-section.active-border {
            border-color: var(--primary-light);
            box-shadow: 0 0 40px rgba(20, 184, 166, 0.2);
        }

        .calling-label {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 2rem;
            background: #f1f5f9;
            padding: 10px 40px;
            border-radius: 50px;
            text-align: center;
            white-space: nowrap;
        }

        .calling-number {
            font-size: clamp(8rem, 15vw, 14rem);
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -5px;
        }

        /* Ping animation for new call */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim {
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        /* Right Side: Waiting List */
        .waiting-section {
            flex: 1;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            min-height: 0; /* Flexの子要素が親の高さに合わせてスクロールできるようにする */
        }

        .waiting-section h2 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap; /* テキストが折り返せるようにする */
            gap: 10px;
        }
        
        .waiting-section h2 span {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .number-grid {
            display: grid;
            /* 画面サイズに合わせて列数を自動調整 */
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 1.5rem;
            overflow-y: auto;
            align-content: start;
            padding-right: 10px; /* For scrollbar */
            flex: 1;
        }

        /* Scrollbar styling */
        .number-grid::-webkit-scrollbar { width: 8px; }
        .number-grid::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .number-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .num-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.5rem 0.5rem;
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* States for cards */
        .num-card.status-calling {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(15, 118, 110, 0.3);
        }
        
        .num-card.status-calling::after {
            content: "お呼出中";
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            font-size: 0.75rem;
            font-weight: normal;
            color: rgba(255,255,255,0.9);
        }

        .num-card.status-done {
            background: var(--done-bg);
            border-color: transparent;
            color: var(--done-text);
            box-shadow: none;
        }

        /* Ticker Footer */
        .ticker-wrapper {
            background: #1e293b;
            color: white;
            height: 4rem;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .ticker-label {
            background: var(--accent);
            color: white;
            padding: 0 2rem;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 2;
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 4px 0 10px rgba(0,0,0,0.2);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .ticker-label::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 0;
            border-top: 2rem solid transparent;
            border-bottom: 2rem solid transparent;
            border-left: 15px solid var(--accent);
        }

        .ticker-content {
            padding-left: 100%; /* Start off-screen */
            display: inline-block;
            white-space: nowrap;
            font-size: 1.3rem;
            animation: ticker 35s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            margin-right: 4rem;
        }

        .ticker-item::before {
            content: "◆";
            color: var(--primary-light);
            margin-right: 1rem;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* -------------------------------------------
           Responsive Design (Media Queries)
        ------------------------------------------- */

        /* ノートPC・小さめのディスプレイ向け */
        @media (max-width: 1024px) {
            header {
                padding: 1rem 2rem;
            }
            main {
                padding: 1.5rem 2rem;
                gap: 2rem;
            }
            .calling-section {
                flex: 0 0 40%;
            }
            .waiting-section h2 {
                font-size: 1.6rem;
            }
            .waiting-section h2 span {
                font-size: 1rem;
            }
            .num-card {
                font-size: 1.8rem;
                padding: 1rem 0.5rem;
            }
        }

        /* タブレット（縦）向け */
        @media (max-width: 820px) {
            body {
                /* 高さを固定せず、内容に応じてスクロールできるようにする */
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }
            main {
                flex-direction: column; /* 縦並びに変更 */
                padding: 1.5rem;
                gap: 1.5rem;
                height: auto;
            }
            .calling-section {
                padding: 3rem 1rem;
            }
            .calling-number {
                font-size: 8rem;
            }
            .waiting-section {
                /* 縦並びの時は高さを持たせてスクロール領域を確保する */
                height: 500px;
                padding: 1.5rem;
            }
        }

        /* スマートフォン向け */
        @media (max-width: 480px) {
            header {
                padding: 0.8rem 1rem;
                flex-direction: column; /* スマホでは縦並び */
                gap: 0.5rem;
            }
            header h1 {
                font-size: 1.5rem;
            }
            .time {
                font-size: 1.2rem;
            }
            main {
                padding: 1rem;
                gap: 1rem;
            }
            .calling-section {
                padding: 2rem 1rem;
                border-radius: 16px;
            }
            .calling-label {
                font-size: 1.2rem;
                padding: 8px 20px;
                margin-bottom: 1rem;
            }
            .calling-number {
                font-size: 6rem;
            }
            .waiting-section {
                border-radius: 16px;
                padding: 1rem;
                height: 400px; /* スマホ向けに少し低く */
            }
            .waiting-section h2 {
                font-size: 1.3rem;
                margin-bottom: 1rem;
                flex-direction: column; /* サブタイトルを改行 */
                align-items: flex-start;
                gap: 5px;
            }
            .waiting-section h2 span {
                font-size: 0.9rem;
            }
            .number-grid {
                /* スマホではより多くの列を表示するため最小幅を狭くする */
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 0.8rem;
            }
            .num-card {
                font-size: 1.4rem;
                padding: 0.8rem 0.2rem;
                border-radius: 10px;
            }
            .num-card.status-calling::after {
                font-size: 0.6rem;
                bottom: 2px;
            }
            /* ティッカーの設定 */
            .ticker-wrapper {
                height: 3rem;
            }
            .ticker-label {
                font-size: 1rem;
                padding: 0 1rem;
            }
            .ticker-label::after {
                border-top: 1.5rem solid transparent;
                border-bottom: 1.5rem solid transparent;
                border-left: 10px solid var(--accent);
                right: -10px;
            }
            .ticker-content {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1><div class="header-icon">✚</div> 中央薬局</h1>
        <div class="time" id="clock">00:00:00</div>
    </header>

    <!-- Main Board -->
    <main>
        <!-- Calling Now -->
        <section class="calling-section" id="calling-box">
            <div class="calling-label">現在のお呼出番号</div>
            <div class="calling-number" id="main-number">---</div>
        </section>

        <!-- Waiting List -->
        <section class="waiting-section">
            <h2>お薬お渡し待ち <span>順次お呼び出しいたします</span></h2>
            <div class="number-grid" id="grid-container">
                <!-- JavaScript will populate cards here -->
            </div>
        </section>
    </main>

    <!-- Info Ticker -->
    <div class="ticker-wrapper">
        <div class="ticker-label">お知らせ</div>
        <div class="ticker-content">
            <span class="ticker-item">本日はご来局ありがとうございます。</span>
            <span class="ticker-item">おくすり手帳をお持ちの方は受付にお出しください。</span>
            <span class="ticker-item">マイナンバーカードの保険証利用にご協力をお願いいたします。</span>
            <span class="ticker-item">ジェネリック医薬品への変更をご希望の方は、お気軽に薬剤師までお申し付けください。</span>
            <span class="ticker-item">お車でお越しの方は、提携駐車場の駐車券を受付までお持ちください。</span>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // 1. Clock Update
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ja-JP', { hour12: false });
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Simulation Logic
        const startNum = 145; // Start of the sequence
        const endNum = 175;   // End of the sequence
        let currentNum = 153; // Number currently being called
        
        const grid = document.getElementById('grid-container');
        const mainNumber = document.getElementById('main-number');
        const callingBox = document.getElementById('calling-box');
        
        // Dictionary to store card elements
        const cardElements = {};

        // Initialize Grid
        function initGrid() {
            grid.innerHTML = '';
            for (let i = startNum; i <= endNum; i++) {
                const card = document.createElement('div');
                card.className = 'num-card';
                card.innerText = i;
                
                // Pre-set styles based on current number
                if (i < currentNum) {
                    card.classList.add('status-done');
                } else if (i === currentNum) {
                    card.classList.add('status-calling');
                    mainNumber.innerText = i;
                }
                
                grid.appendChild(card);
                cardElements[i] = card;
            }
        }

        // Call the next number
        function callNextNumber() {
            // Mark previous as done
            if (cardElements[currentNum]) {
                cardElements[currentNum].classList.remove('status-calling');
                cardElements[currentNum].classList.add('status-done');
            }

            // Increment or reset
            currentNum++;
            if (currentNum > endNum) {
                // Loop back for demo purposes
                currentNum = startNum;
                // Reset all cards to default visually
                Object.values(cardElements).forEach(card => {
                    card.className = 'num-card';
                });
            }

            // Update Main Display with Animation
            mainNumber.innerText = currentNum;
            
            // Re-trigger CSS animation
            mainNumber.classList.remove('pop-anim');
            callingBox.classList.remove('active-border');
            
            // Trigger reflow to restart animation
            void mainNumber.offsetWidth; 
            
            mainNumber.classList.add('pop-anim');
            callingBox.classList.add('active-border');

            // Highlight new card in grid
            if (cardElements[currentNum]) {
                cardElements[currentNum].classList.add('status-calling');
                // Scroll grid to the new number smoothly
                cardElements[currentNum].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Setup
        initGrid();
        
        // Simulate a new call every 6 seconds to show off the design
        setInterval(callNextNumber, 6000);

    </script>
</body>
</html>
